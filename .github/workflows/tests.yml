name: tests

on:
  push:
  pull_request:

jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if course dumps (fiap/) are tracked
        run: |
          if git ls-files | grep -E '(^|/)fiap(/|$)'; then
            echo "Material de curso em fiap/ nao pode entrar no git."
            exit 1
          fi
      - name: Syntax check (ruff E9/F)
        run: |
          python -m pip install --upgrade pip
          pip install "ruff>=0.8,<1"
          ruff check .

  fase3:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fase3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Fase 3 test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
      - name: Run Fase 3 pytest
        env:
          SKLEARN_N_JOBS: "1"
        run: pytest -q

  fase2:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fase2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Fase 2 test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Fase 2 pytest
        run: pytest -q
